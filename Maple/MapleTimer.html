<!doctype html>
<!--
MapleTimer 웹 버전 1.0.1 · 제작 JH
이 파일은 제작자(JH)의 허락 없이 수정하거나
다른 사람에게 다시 배포할 수 없습니다. 개인적인 사용만 허용됩니다.
넥슨과 관계없는 비공식 프로그램입니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapleTimer</title>
<style>
  body { margin: 0; padding: 12px; font-family: "Malgun Gothic", sans-serif; font-size: 13px; background: #f0f0f0; color: #222; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #adadad; border-radius: 4px; background: #fdfdfd; cursor: pointer; }
  button:hover:enabled { background: #e5f1fb; border-color: #0078d4; }
  button:disabled { color: #a0a0a0; cursor: default; }
  input[type=number] { font: inherit; width: 56px; padding: 2px 4px; border: 1px solid #adadad; border-radius: 3px; }

  #toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #gameStatus { flex: 1; }
  #pauseButton.paused { background: #f9a825; border-color: #c17900; font-weight: bold; }
  #credit { color: #888; }
  #volume { width: 100px; }

  fieldset { border: 1px solid #c8c8c8; border-radius: 6px; background: #fafafa; margin: 0 0 10px; padding: 6px 10px 10px; }
  legend { font-weight: bold; padding: 0 4px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .spacer { flex: 1; }
  .regionInfo { font-size: 12px; color: #2e7d32; }
  .regionInfo.missing { color: #888; }
  .regionInfo.warning { color: #c17900; }
  .preview { height: 90px; display: flex; align-items: center; margin: 6px 0; }
  .preview canvas { max-width: 100%; max-height: 90px; image-rendering: pixelated; }
  .status { flex: 1; padding: 4px; }
  .status.alert { background: #d32f2f; color: white; font-weight: bold; border-radius: 4px; }
  .mute:enabled { background: #d32f2f; color: white; font-weight: bold; }

  #picker { width: 95vw; max-width: none; border: 1px solid #adadad; border-radius: 6px; padding: 12px; }
  #picker::backdrop { background: rgba(0, 0, 0, 0.4); }
  #pickerGuide { margin: 0 0 8px; white-space: pre-line; }
  #pickerCanvas { display: block; width: 100%; height: calc(100vh - 190px); cursor: crosshair; touch-action: none; }
  .dialogButtons { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  #pickerZoom { min-width: 48px; text-align: right; color: #555; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="shareButton">게임 창 선택</button>
  <button id="pauseButton">전체 알림 일시정지</button>
  <button id="saveFrameButton" title="받은 게임 화면을 크기 그대로 PNG로 저장 (디버그용, ?debug로 열었을 때만 보임)">화면 저장</button>
  <span id="gameStatus"></span>
  <span id="credit">웹 버전 1.0.1 · 제작 JH · 무단 수정·재배포 금지</span>
  <label for="volume">음량</label>
  <input id="volume" type="range" min="0" max="100">
</div>

<template id="featureTemplate">
  <fieldset>
    <legend></legend>
    <div class="row controls">
      <label><input type="checkbox" class="use"> 사용</label>
      <button class="regionButton"></button>
      <span class="regionInfo"></span>
      <span class="spacer"></span>
    </div>
    <div class="preview"><canvas></canvas></div>
    <div class="row">
      <span class="status"></span>
      <label title="알림을 5초 간격으로 몇 번 더 울릴지 (0 = 한 번만)">반복 <input type="number" class="repeat" min="0" max="99"> 회</label>
      <button class="mute">알림 중지</button>
    </div>
  </fieldset>
</template>
<div id="features"></div>

<dialog id="picker">
  <form method="dialog">
    <p id="pickerGuide"></p>
    <canvas id="pickerCanvas"></canvas>
    <div class="dialogButtons">
      <button type="button" id="pickerZoomOut" title="축소 (휠 아래로)">축소</button>
      <span id="pickerZoom"></span>
      <button type="button" id="pickerZoomIn" title="확대 (휠 위로)">확대</button>
      <button type="button" id="pickerFit" title="게임 화면 전체를 봅니다">전체 보기</button>
      <span class="spacer"></span>
      <button value="ok" id="pickerOk">확인</button>
      <button value="cancel">취소</button>
    </div>
  </form>
</dialog>
